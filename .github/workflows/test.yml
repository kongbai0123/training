name: Test Suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      # CI runners have no CUDA device. Derive a CPU-only variant of the shipping
      # requirements instead of maintaining a second pin list that can drift:
      # requirements.txt stays the single source of truth for dependency versions.
      - name: Derive CPU-only requirement set
        shell: bash
        run: |
          sed -e 's#/whl/cu121#/whl/cpu#' -e 's#+cu121##' requirements.txt > requirements-ci.txt
          echo "--- requirements-ci.txt ---"
          cat requirements-ci.txt
      - name: Install test and runtime dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-ci.txt
      - name: Run non-GPU test suite
        run: python -m pytest tests -q -m "not gpu" --junitxml=report.xml
      - name: Compile Python entry points and packages
        run: python -m compileall -q src app.py launcher.py
      - name: Check CSS tokens and generated API contracts
        run: |
          python tools/check_css_tokens.py
          python tools/generate_frontend_api_types.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run Playwright and axe checks
        run: npm run test:e2e
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: report.xml
          if-no-files-found: ignore
